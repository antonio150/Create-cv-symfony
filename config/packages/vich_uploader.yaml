# config/packages/vich_uploader.yaml or app/config/config.yml
vich_uploader:
    db_driver: orm

    metadata:
        type: attribute

    mappings:
        post_thumbnails:
            uri_prefix: /upload/image
            upload_destination: '%kernel.project_dir%/public/assets/images/photo-cv'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer